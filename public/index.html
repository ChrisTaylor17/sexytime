<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consilience DAO - The Future of Collaboration</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        :root {
            --bg-primary: #000000;
            --bg-secondary: #111111;
            --bg-tertiary: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --text-muted: #888888;
            --border: #333333;
            --accent: #ffffff;
        }
        
        [data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f8f8;
            --bg-tertiary: #eeeeee;
            --text-primary: #000000;
            --text-secondary: #333333;
            --text-muted: #666666;
            --border: #dddddd;
            --accent: #000000;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }
        
        .app {
            display: flex;
            height: 100vh;
        }
        
        .sidebar {
            width: 240px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .logo {
            font-weight: 700;
            font-size: 14px;
            letter-spacing: -0.5px;
        }
        
        .theme-toggle {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
        }
        
        .nav-section {
            padding: 16px 12px 8px;
        }
        
        .nav-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            padding: 6px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 2px;
            transition: background 0.1s;
        }
        
        .nav-item:hover {
            background: var(--bg-tertiary);
        }
        
        .nav-item.active {
            background: var(--accent);
            color: var(--bg-primary);
        }
        
        .nav-icon {
            margin-right: 8px;
            font-size: 14px;
        }
        
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            height: 48px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 16px;
        }
        
        .header-title {
            font-weight: 500;
            font-size: 14px;
        }
        
        .content {
            flex: 1;
            overflow: hidden;
            display: flex;
        }
        
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }
        
        .message {
            margin-bottom: 16px;
            display: flex;
            align-items: flex-start;
        }
        
        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            background: var(--accent);
            color: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 500;
            margin-right: 12px;
            flex-shrink: 0;
        }
        
        .message-content {
            flex: 1;
        }
        
        .message-header {
            display: flex;
            align-items: center;
            margin-bottom: 4px;
        }
        
        .message-author {
            font-weight: 500;
            font-size: 13px;
            margin-right: 8px;
        }
        
        .message-time {
            font-size: 11px;
            color: var(--text-muted);
        }
        
        .message-text {
            font-size: 13px;
            line-height: 1.4;
            white-space: pre-wrap;
        }
        
        .input-area {
            padding: 16px;
            border-top: 1px solid var(--border);
        }
        
        .input-container {
            display: flex;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }
        
        .message-input {
            flex: 1;
            background: none;
            border: none;
            padding: 12px 16px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 13px;
            outline: none;
        }
        
        .message-input::placeholder {
            color: var(--text-muted);
        }
        
        .send-button {
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            padding: 12px 16px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
        }
        
        .send-button:hover {
            opacity: 0.8;
        }
        
        .right-panel {
            width: 280px;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }
        
        .panel-section {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }
        
        .panel-title {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }
        
        .user-card {
            background: var(--bg-tertiary);
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 8px;
        }
        
        .user-name {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .user-status {
            font-size: 11px;
            color: var(--text-muted);
        }
        
        .project-item {
            padding: 8px 0;
            border-bottom: 1px solid var(--border);
        }
        
        .project-name {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 2px;
        }
        
        .project-desc {
            font-size: 11px;
            color: var(--text-muted);
        }
        
        .signup-form {
            padding: 16px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            margin-bottom: 16px;
        }
        
        .form-input {
            width: 100%;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 12px;
            margin-bottom: 8px;
        }
        
        .form-button {
            width: 100%;
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
        }
        
        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff00;
            margin-left: 8px;
        }
        
        /* Task Management Styles */
        .tasks-container { padding: 20px; height: 100%; overflow-y: auto; }
        .tasks-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .task-categories { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; height: calc(100% - 80px); }
        .task-column { background: var(--bg-secondary); border-radius: 8px; padding: 16px; }
        .task-column h3 { margin-bottom: 16px; font-size: 14px; }
        .task-list { display: flex; flex-direction: column; gap: 12px; }
        .task-card { background: var(--bg-tertiary); border-radius: 6px; padding: 12px; border: 1px solid var(--border); }
        .task-title { font-weight: 500; font-size: 13px; margin-bottom: 4px; }
        .task-description { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
        .task-reward { font-size: 11px; color: #00ff00; margin-bottom: 8px; }
        .task-actions button { background: var(--accent); color: var(--bg-primary); border: none; padding: 4px 8px; border-radius: 4px; font-size: 10px; cursor: pointer; }
        
        /* Projects Styles */
        .projects-container { padding: 20px; height: 100%; overflow-y: auto; }
        .projects-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .projects-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .project-card { background: var(--bg-secondary); border-radius: 8px; padding: 16px; border: 1px solid var(--border); }
        .project-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .project-status { padding: 2px 8px; border-radius: 4px; font-size: 10px; text-transform: uppercase; }
        .project-status.active { background: #00ff00; color: #000; }
        .project-description { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
        .project-stats { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .project-stat { font-size: 11px; }
        .stat-label { color: var(--text-muted); }
        .progress-bar { width: 100%; height: 4px; background: var(--bg-tertiary); border-radius: 2px; margin-bottom: 12px; }
        .progress-fill { height: 100%; background: #00ff00; border-radius: 2px; }
        .project-stats { display: flex; gap: 20px; }
        .stat-card { background: var(--bg-secondary); padding: 16px; border-radius: 8px; text-align: center; }
        .stat-number { font-size: 24px; font-weight: 700; }
        .stat-label { font-size: 11px; color: var(--text-muted); }
        
        /* Achievements Styles */
        .achievements-container { padding: 20px; height: 100%; overflow-y: auto; }
        .achievements-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .total-cs { font-size: 18px; font-weight: 500; }
        .achievement-section { margin-bottom: 24px; }
        .achievement-section h3 { margin-bottom: 12px; font-size: 14px; }
        .achievement-list { display: flex; flex-direction: column; gap: 8px; }
        .achievement-card { display: flex; align-items: center; background: var(--bg-secondary); padding: 12px; border-radius: 6px; }
        .achievement-icon { font-size: 20px; margin-right: 12px; }
        .achievement-content { flex: 1; }
        .achievement-title { font-size: 13px; font-weight: 500; }
        .achievement-date { font-size: 11px; color: var(--text-muted); }
        .achievement-reward { font-size: 11px; color: #00ff00; }
        
        /* Leaderboard Styles */
        .leaderboard-container { padding: 20px; height: 100%; overflow-y: auto; }
        .leaderboard-header { margin-bottom: 20px; }
        .leaderboard-stats { display: flex; gap: 20px; margin-top: 8px; }
        .leaderboard-stats .stat { font-size: 12px; color: var(--text-muted); }
        .leaderboard-list { display: flex; flex-direction: column; gap: 8px; }
        .leaderboard-item { display: flex; align-items: center; background: var(--bg-secondary); padding: 12px; border-radius: 6px; }
        .leaderboard-item.current-user { border: 1px solid #00ff00; }
        .rank { font-size: 16px; font-weight: 700; margin-right: 16px; min-width: 30px; }
        .user-info { flex: 1; }
        .username { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
        .user-stats { display: flex; gap: 12px; font-size: 11px; color: var(--text-muted); }
        
        .btn { background: var(--accent); color: var(--bg-primary); border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="app">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo">CONSILIENCE</div>
                <div style="display: flex; gap: 8px;">
                    <button class="theme-toggle" onclick="toggleTheme()">◐</button>
                    <button class="theme-toggle" id="walletBtn" onclick="connectWallet()">Connect</button>
                </div>
            </div>
            
            <div class="nav-section">
                <div class="nav-title">Main</div>
                <div class="nav-item active" data-page="dashboard" onclick="app.showPage('dashboard')">
                    <span class="nav-icon">🏠</span>
                    Dashboard
                </div>
                <div class="nav-item" data-page="matches" onclick="app.showPage('matches')">
                    <span class="nav-icon">🎯</span>
                    Matches
                </div>
                <div class="nav-item" data-page="chat" onclick="app.showPage('chat')">
                    <span class="nav-icon">💬</span>
                    Chat
                </div>
                <div class="nav-item" data-page="projects" onclick="app.showPage('projects')">
                    <span class="nav-icon">🚀</span>
                    Projects
                </div>
            </div>
            
            <div class="nav-section">
                <div class="nav-title">Marketplace</div>
                <div class="nav-item" data-page="marketplace" onclick="app.showPage('marketplace')">
                    <span class="nav-icon">🏪</span>
                    Browse
                </div>
                <div class="nav-item" onclick="app.mintNFT()">
                    <span class="nav-icon">🎨</span>
                    Create NFT
                </div>
                <div class="nav-item" onclick="app.createToken()">
                    <span class="nav-icon">🪙</span>
                    Launch Token
                </div>
            </div>
            
            <div class="nav-section">
                <div class="nav-title">Account</div>
                <div class="nav-item" data-page="profile" onclick="app.showPage('profile')">
                    <span class="nav-icon">👤</span>
                    Profile
                </div>
                <div class="nav-item" onclick="app.showWallet()">
                    <span class="nav-icon">💼</span>
                    Wallet
                </div>
            </div>
        </div>
        
        <div class="main-content">
            <!-- Content will be dynamically loaded here by app.js -->
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="wallet.js"></script>
    <script src="app.js"></script>
    <script>
        // Global configuration
        const API_URL = window.location.origin;
        
        // Theme toggle
        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            body.setAttribute('data-theme', currentTheme === 'light' ? 'dark' : 'light');
            localStorage.setItem('consilience_theme', currentTheme === 'light' ? 'dark' : 'light');
        }
        
        // Load saved theme
        const savedTheme = localStorage.getItem('consilience_theme');
        if (savedTheme) {
            document.body.setAttribute('data-theme', savedTheme);
        }
        
        // Wallet connection
        async function connectWallet() {
            const wallet = await walletManager.connectWallet();
            if (wallet && app) {
                // Refresh current page to show updated wallet info
                app.showPage(app.currentPage);
            }
        }
        
        // Initialize on page load
        window.addEventListener('load', () => {
            walletManager.updateWalletUI();
            // App is initialized in app.js
        });
    </script>
</body>
</html>
