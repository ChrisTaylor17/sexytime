<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consilience DAO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --card: #1a1a1a;
            --border: #333;
            --text: #fff;
            --text-dim: #888;
            --accent: #00ff88;
            --accent-dim: #00cc6a;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }
        
        .logo {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent);
        }
        
        .nav {
            display: flex;
            gap: 30px;
        }
        
        .nav-item {
            padding: 10px 20px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        
        .nav-item:hover {
            background: var(--accent);
            color: var(--bg);
        }
        
        .nav-item.active {
            background: var(--accent);
            color: var(--bg);
        }
        
        .content {
            min-height: 70vh;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            transition: all 0.2s;
        }
        
        .card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }
        
        .card h3 {
            margin-bottom: 12px;
            color: var(--accent);
        }
        
        .card p {
            color: var(--text-dim);
            margin-bottom: 16px;
        }
        
        .btn {
            background: var(--accent);
            color: var(--bg);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn:hover {
            background: var(--accent-dim);
            transform: translateY(-1px);
        }
        
        .btn-secondary {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            background: var(--border);
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        
        .stat {
            background: var(--card);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            flex: 1;
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: var(--accent);
        }
        
        .stat-label {
            color: var(--text-dim);
            font-size: 14px;
        }
        
        .chat-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            height: 600px;
        }
        
        .chat-sidebar {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
        }
        
        .chat-main {
            background: var(--card);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
        }
        
        .chat-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
        }
        
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .chat-input {
            padding: 20px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
        }
        
        .chat-input input {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 16px;
            border-radius: 8px;
        }
        
        .message {
            margin-bottom: 16px;
            padding: 12px;
            background: var(--bg);
            border-radius: 8px;
        }
        
        .message-author {
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 4px;
        }
        
        .user-card {
            padding: 12px;
            margin-bottom: 8px;
            background: var(--bg);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .user-card:hover {
            background: var(--border);
        }
        
        .user-name {
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .user-status {
            font-size: 12px;
            color: var(--text-dim);
        }
        
        .form {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 16px;
            border-radius: 8px;
        }
        
        .form-group textarea {
            height: 100px;
            resize: vertical;
        }
        
        .wallet-info {
            background: var(--card);
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .hidden {
            display: none;
        }
        
        @media (max-width: 768px) {
            .nav {
                flex-direction: column;
                gap: 10px;
            }
            
            .chat-container {
                grid-template-columns: 1fr;
                height: auto;
            }
            
            .stats {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">CONSILIENCE DAO</div>
            <div class="nav">
                <div class="nav-item active" onclick="showPage('dashboard')">Dashboard</div>
                <div class="nav-item" onclick="showPage('chat')">Chat</div>
                <div class="nav-item" onclick="showPage('projects')">Projects</div>
                <div class="nav-item" onclick="showPage('create')">Create</div>
                <div class="nav-item" onclick="showPage('profile')">Profile</div>
            </div>
            <button class="btn" id="walletBtn" onclick="connectWallet()">Connect Wallet</button>
        </div>
        
        <div class="content" id="content">
            <!-- Content loads here -->
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="wallet.js"></script>
    <script>
        let currentUser = JSON.parse(localStorage.getItem('consilience_user')) || null;
        let socket = io();
        let currentPage = 'dashboard';

        // Page management
        function showPage(page) {
            currentPage = page;
            
            // Update nav
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            event.target.classList.add('active');
            
            // Load page content
            const content = document.getElementById('content');
            
            switch(page) {
                case 'dashboard':
                    content.innerHTML = renderDashboard();
                    break;
                case 'chat':
                    content.innerHTML = renderChat();
                    initChat();
                    break;
                case 'projects':
                    content.innerHTML = renderProjects();
                    loadProjects();
                    break;
                case 'create':
                    content.innerHTML = renderCreate();
                    break;
                case 'profile':
                    content.innerHTML = renderProfile();
                    break;
            }
        }

        function renderDashboard() {
            return `
                <div class="stats">
                    <div class="stat">
                        <div class="stat-number">${currentUser?.cs_balance || 0}</div>
                        <div class="stat-label">CS Tokens</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number">${currentUser?.nfts || 0}</div>
                        <div class="stat-label">NFTs Created</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number">${currentUser?.projects || 0}</div>
                        <div class="stat-label">Projects</div>
                    </div>
                </div>
                
                <div class="grid">
                    <div class="card">
                        <h3>🎯 Find Collaborators</h3>
                        <p>Connect with builders who share your vision and skills</p>
                        <button class="btn" onclick="findMatches()">Find Matches</button>
                    </div>
                    
                    <div class="card">
                        <h3>🚀 Launch Project</h3>
                        <p>Start a new DAO project and gather your team</p>
                        <button class="btn" onclick="showPage('create')">Create Project</button>
                    </div>
                    
                    <div class="card">
                        <h3>💬 Active Chats</h3>
                        <p>Continue conversations with your collaborators</p>
                        <button class="btn" onclick="showPage('chat')">Open Chat</button>
                    </div>
                    
                    <div class="card">
                        <h3>🎨 Create NFT</h3>
                        <p>Mint unique digital assets on Solana blockchain</p>
                        <button class="btn" onclick="mintNFT()">Mint NFT</button>
                    </div>
                </div>
            `;
        }

        function renderChat() {
            return `
                <div class="chat-container">
                    <div class="chat-sidebar">
                        <h3>Conversations</h3>
                        <div class="user-card" onclick="openChat('alice.builder')">
                            <div class="user-name">alice.builder</div>
                            <div class="user-status">🟢 Online - Mars Colony DAO</div>
                        </div>
                        <div class="user-card" onclick="openChat('bob.creator')">
                            <div class="user-name">bob.creator</div>
                            <div class="user-status">🟡 Away - Ocean Cleanup</div>
                        </div>
                        <div class="user-card" onclick="openChat('charlie.dev')">
                            <div class="user-name">charlie.dev</div>
                            <div class="user-status">🟢 Online - Available</div>
                        </div>
                    </div>
                    
                    <div class="chat-main">
                        <div class="chat-header" id="chatHeader">
                            Select a conversation to start chatting
                        </div>
                        <div class="chat-messages" id="chatMessages">
                            <div style="text-align: center; padding: 40px; color: var(--text-dim);">
                                Choose someone to chat with from the sidebar
                            </div>
                        </div>
                        <div class="chat-input" id="chatInput" style="display: none;">
                            <input type="text" id="messageInput" placeholder="Type your message...">
                            <button class="btn" onclick="sendMessage()">Send</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderProjects() {
            return `
                <h2>DAO Projects</h2>
                <div class="grid" id="projectsGrid">
                    <!-- Projects load here -->
                </div>
            `;
        }

        function renderCreate() {
            return `
                <div class="form">
                    <h2>Create Something Amazing</h2>
                    
                    <div class="grid">
                        <div class="card">
                            <h3>🎨 Mint NFT</h3>
                            <p>Create a unique digital asset on Solana</p>
                            <button class="btn" onclick="mintNFT()">Create NFT</button>
                        </div>
                        
                        <div class="card">
                            <h3>🪙 Launch Token</h3>
                            <p>Create your own cryptocurrency token</p>
                            <button class="btn" onclick="createToken()">Create Token</button>
                        </div>
                        
                        <div class="card">
                            <h3>🚀 Start Project</h3>
                            <p>Launch a new DAO project</p>
                            <button class="btn" onclick="createProject()">New Project</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderProfile() {
            return `
                <div class="form">
                    <h2>Your Profile</h2>
                    
                    ${currentUser ? `
                        <div class="wallet-info">
                            <h3>Welcome, ${currentUser.alias}!</h3>
                            <p>CS Balance: ${currentUser.cs_balance || 0} tokens</p>
                            <p>Wallet: ${currentUser.wallet_address || 'Not connected'}</p>
                        </div>
                    ` : `
                        <div class="form-group">
                            <label>Alias</label>
                            <input type="text" id="alias" placeholder="your.alias">
                        </div>
                        <div class="form-group">
                            <label>Interests</label>
                            <textarea id="interests" placeholder="What are you passionate about?"></textarea>
                        </div>
                        <button class="btn" onclick="signup()">Join DAO</button>
                    `}
                </div>
            `;
        }

        // Core functions
        async function signup() {
            const alias = document.getElementById('alias').value;
            const interests = document.getElementById('interests').value;
            
            if (!alias || !interests) return;
            
            try {
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        alias, 
                        interests,
                        walletAddress: walletManager.wallet
                    })
                });
                
                const data = await response.json();
                currentUser = data;
                localStorage.setItem('consilience_user', JSON.stringify(data));
                showPage('dashboard');
            } catch (error) {
                alert('Signup failed. Try again.');
            }
        }

        async function mintNFT() {
            const description = prompt('Describe your NFT:') || 'Consilience DAO NFT';
            
            try {
                const response = await fetch('/api/ai-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: `mint an NFT: ${description}`,
                        alias: currentUser?.alias || 'anonymous'
                    })
                });
                
                const data = await response.json();
                alert(data.response);
                
                // Update user data
                if (data.response.includes('✅ REAL NFT')) {
                    if (currentUser) {
                        currentUser.nfts = (currentUser.nfts || 0) + 1;
                        currentUser.cs_balance = (currentUser.cs_balance || 0) + 25;
                        localStorage.setItem('consilience_user', JSON.stringify(currentUser));
                    }
                }
            } catch (error) {
                alert('NFT creation failed');
            }
        }

        async function createToken() {
            const name = prompt('Token name:') || 'My Token';
            
            try {
                const response = await fetch('/api/ai-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: `create token: ${name}`,
                        alias: currentUser?.alias || 'anonymous'
                    })
                });
                
                const data = await response.json();
                alert(data.response);
            } catch (error) {
                alert('Token creation failed');
            }
        }

        function createProject() {
            const name = prompt('Project name:');
            const description = prompt('Project description:');
            
            if (name && description) {
                alert(`Project "${name}" created! Start inviting collaborators.`);
            }
        }

        function findMatches() {
            alert('🎯 Finding perfect matches based on your skills and interests...\n\nMatches found:\n• alice.builder (95% match)\n• bob.creator (87% match)\n• charlie.dev (82% match)');
        }

        let currentChatUser = null;

        function openChat(username) {
            currentChatUser = username;
            document.getElementById('chatHeader').textContent = `Chat with ${username}`;
            
            const initialMessages = {
                'alice.builder': "Hey! I'm working on the Mars Colony DAO and saw your profile. Your skills in blockchain development could be perfect for our habitat governance system. Want to collaborate?",
                'bob.creator': "Hi there! I'm leading the Ocean Cleanup Protocol and we need someone with your expertise. We're building DeFi mechanisms for environmental impact. Interested in making a real difference?",
                'charlie.dev': "What's up! I'm a Rust developer looking for interesting DAO projects to contribute to. I saw your profile and think we could build something amazing together. What are you working on?"
            };
            
            document.getElementById('chatMessages').innerHTML = `
                <div class="message">
                    <div class="message-author">${username}</div>
                    <div>${initialMessages[username] || "Hey! I saw we're a great match for collaboration. What projects are you working on?"}</div>
                </div>
            `;
            document.getElementById('chatInput').style.display = 'flex';
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message || !currentChatUser) return;
            
            const messagesDiv = document.getElementById('chatMessages');
            messagesDiv.innerHTML += `
                <div class="message">
                    <div class="message-author">You</div>
                    <div>${message}</div>
                </div>
            `;
            
            input.value = '';
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            // Get AI response
            try {
                const response = await fetch('/api/chat-response', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message,
                        chatUser: currentChatUser,
                        userAlias: currentUser?.alias || 'anonymous'
                    })
                });
                
                const data = await response.json();
                
                setTimeout(() => {
                    messagesDiv.innerHTML += `
                        <div class="message">
                            <div class="message-author">${currentChatUser}</div>
                            <div>${data.response}</div>
                        </div>
                    `;
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                }, 800);
            } catch (error) {
                // Fallback responses
                const responses = [
                    "That's a great point! What do you think about implementing that?",
                    "I'm really interested in collaborating on this. Do you have any specific ideas?",
                    "Sounds like we're aligned on the vision. Should we start planning?",
                    "I love that approach! How do you see us moving forward?",
                    "That could work really well. What's your timeline looking like?"
                ];
                
                setTimeout(() => {
                    messagesDiv.innerHTML += `
                        <div class="message">
                            <div class="message-author">${currentChatUser}</div>
                            <div>${responses[Math.floor(Math.random() * responses.length)]}</div>
                        </div>
                    `;
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                }, 800);
            }
        }

        function loadProjects() {
            document.getElementById('projectsGrid').innerHTML = `
                <div class="card">
                    <h3>Mars Colony DAO</h3>
                    <p>Building sustainable habitats on Mars using blockchain governance</p>
                    <button class="btn">Join Project</button>
                </div>
                <div class="card">
                    <h3>Ocean Cleanup Protocol</h3>
                    <p>DeFi-powered ocean cleanup with environmental impact tracking</p>
                    <button class="btn">Join Project</button>
                </div>
                <div class="card">
                    <h3>Neural Network DAO</h3>
                    <p>Decentralized AI research and development</p>
                    <button class="btn">Join Project</button>
                </div>
            `;
        }

        function initChat() {
            // Chat initialization
        }

        async function connectWallet() {
            const wallet = await walletManager.connectWallet();
            if (wallet) {
                document.getElementById('walletBtn').textContent = wallet.slice(0, 8) + '...';
                if (currentPage === 'profile') showPage('profile');
            }
        }

        // Initialize
        showPage('dashboard');
        walletManager.updateWalletUI();
    </script>
</body>
</html>
