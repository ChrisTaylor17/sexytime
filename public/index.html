<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consilience DAO</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #fff;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 30px;
        }
        
        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #00ff88;
        }
        
        .nav {
            display: flex;
            gap: 20px;
        }
        
        .nav-item {
            padding: 10px 20px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .nav-item:hover, .nav-item.active {
            background: #00ff88;
            color: #000;
        }
        
        .btn {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .btn:hover {
            background: #00cc6a;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        
        .card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 24px;
        }
        
        .card h3 {
            color: #00ff88;
            margin-bottom: 12px;
        }
        
        .card p {
            color: #888;
            margin-bottom: 16px;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        
        .stat {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            flex: 1;
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: #00ff88;
        }
        
        .stat-label {
            color: #888;
            font-size: 14px;
        }
        
        .chat-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            height: 600px;
        }
        
        .chat-sidebar {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
        }
        
        .chat-main {
            background: #1a1a1a;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
        }
        
        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #333;
            font-weight: 600;
        }
        
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .chat-input {
            padding: 20px;
            border-top: 1px solid #333;
            display: flex;
            gap: 12px;
        }
        
        .chat-input input {
            flex: 1;
            background: #0a0a0a;
            border: 1px solid #333;
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
        }
        
        .message {
            margin-bottom: 16px;
            padding: 12px;
            background: #0a0a0a;
            border-radius: 8px;
        }
        
        .message-author {
            font-weight: 600;
            color: #00ff88;
            margin-bottom: 4px;
        }
        
        .user-card {
            padding: 12px;
            margin-bottom: 8px;
            background: #0a0a0a;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .user-card:hover {
            background: #333;
        }
        
        .user-name {
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .user-status {
            font-size: 12px;
            color: #888;
        }
        
        .form {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
        }
        
        .wallet-info {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">CONSILIENCE DAO</div>
            <div class="nav">
                <div class="nav-item active" onclick="showPage('dashboard')">Dashboard</div>
                <div class="nav-item" onclick="showPage('chat')">Chat</div>
                <div class="nav-item" onclick="showPage('projects')">Projects</div>
                <div class="nav-item" onclick="showPage('create')">Create</div>
                <div class="nav-item" onclick="showPage('profile')">Profile</div>
            </div>
            <button class="btn" id="walletBtn" onclick="connectWallet()">Connect Wallet</button>
        </div>
        
        <div id="content">
            <!-- Content loads here -->
        </div>
    </div>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('consilience_user')) || null;
        let currentPage = 'dashboard';
        let currentChatUser = null;

        // Initialize wallet manager
        const walletManager = {
            wallet: localStorage.getItem('wallet_address'),
            async connectWallet() {
                if (window.solana && window.solana.isPhantom) {
                    try {
                        const response = await window.solana.connect();
                        this.wallet = response.publicKey.toString();
                        localStorage.setItem('wallet_address', this.wallet);
                        return this.wallet;
                    } catch (error) {
                        console.error('Wallet connection failed:', error);
                        return null;
                    }
                } else {
                    alert('Please install Phantom wallet');
                    return null;
                }
            }
        };

        function showPage(page) {
            currentPage = page;
            
            // Update nav
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            event.target.classList.add('active');
            
            const content = document.getElementById('content');
            
            switch(page) {
                case 'dashboard':
                    content.innerHTML = renderDashboard();
                    break;
                case 'chat':
                    content.innerHTML = renderChat();
                    break;
                case 'projects':
                    content.innerHTML = renderProjects();
                    break;
                case 'create':
                    content.innerHTML = renderCreate();
                    break;
                case 'profile':
                    content.innerHTML = renderProfile();
                    break;
            }
        }

        function renderDashboard() {
            return `
                <div class="stats">
                    <div class="stat">
                        <div class="stat-number">${currentUser?.cs_balance || 0}</div>
                        <div class="stat-label">CS Tokens</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number">${currentUser?.nfts || 0}</div>
                        <div class="stat-label">NFTs</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number">${currentUser?.projects || 0}</div>
                        <div class="stat-label">Projects</div>
                    </div>
                </div>
                
                <div class="grid">
                    <div class="card">
                        <h3>🎯 Find Collaborators</h3>
                        <p>Connect with builders who share your vision</p>
                        <button class="btn" onclick="findMatches()">Find Matches</button>
                    </div>
                    
                    <div class="card">
                        <h3>💬 Chat</h3>
                        <p>Talk with your collaborators</p>
                        <button class="btn" onclick="showPage('chat')">Open Chat</button>
                    </div>
                    
                    <div class="card">
                        <h3>🎨 Create NFT</h3>
                        <p>Mint on Solana blockchain</p>
                        <button class="btn" onclick="mintNFT()">Mint NFT</button>
                    </div>
                    
                    <div class="card">
                        <h3>🪙 Create Token</h3>
                        <p>Launch your own token</p>
                        <button class="btn" onclick="createToken()">Create Token</button>
                    </div>
                </div>
            `;
        }

        function renderChat() {
            return `
                <div class="chat-container">
                    <div class="chat-sidebar">
                        <h3>Conversations</h3>
                        <div class="user-card" onclick="openChat('alice.builder')">
                            <div class="user-name">alice.builder</div>
                            <div class="user-status">🟢 Mars Colony DAO</div>
                        </div>
                        <div class="user-card" onclick="openChat('bob.creator')">
                            <div class="user-name">bob.creator</div>
                            <div class="user-status">🟡 Ocean Cleanup</div>
                        </div>
                        <div class="user-card" onclick="openChat('charlie.dev')">
                            <div class="user-name">charlie.dev</div>
                            <div class="user-status">🟢 Available</div>
                        </div>
                    </div>
                    
                    <div class="chat-main">
                        <div class="chat-header" id="chatHeader">
                            Select a conversation
                        </div>
                        <div class="chat-messages" id="chatMessages">
                            <div style="text-align: center; padding: 40px; color: #888;">
                                Choose someone to chat with
                            </div>
                        </div>
                        <div class="chat-input" id="chatInput" style="display: none;">
                            <input type="text" id="messageInput" placeholder="Type message..." onkeypress="if(event.key==='Enter') sendMessage()">
                            <button class="btn" onclick="sendMessage()">Send</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderProjects() {
            return `
                <h2>DAO Projects</h2>
                <div class="grid">
                    <div class="card">
                        <h3>Mars Colony DAO</h3>
                        <p>Building sustainable habitats on Mars</p>
                        <button class="btn" onclick="joinProject('mars')">Join Project</button>
                    </div>
                    <div class="card">
                        <h3>Ocean Cleanup Protocol</h3>
                        <p>DeFi-powered ocean cleanup</p>
                        <button class="btn" onclick="joinProject('ocean')">Join Project</button>
                    </div>
                    <div class="card">
                        <h3>Neural Network DAO</h3>
                        <p>Decentralized AI research</p>
                        <button class="btn" onclick="joinProject('ai')">Join Project</button>
                    </div>
                </div>
            `;
        }

        function renderCreate() {
            return `
                <div class="form">
                    <h2>Create Something Amazing</h2>
                    <div class="grid">
                        <div class="card">
                            <h3>🎨 Mint NFT</h3>
                            <p>Create unique digital asset</p>
                            <button class="btn" onclick="mintNFT()">Create NFT</button>
                        </div>
                        <div class="card">
                            <h3>🪙 Launch Token</h3>
                            <p>Create cryptocurrency token</p>
                            <button class="btn" onclick="createToken()">Create Token</button>
                        </div>
                        <div class="card">
                            <h3>🚀 Start Project</h3>
                            <p>Launch new DAO project</p>
                            <button class="btn" onclick="createProject()">New Project</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderProfile() {
            return `
                <div class="form">
                    <h2>Your Profile</h2>
                    
                    ${currentUser ? `
                        <div class="wallet-info">
                            <h3>Welcome, ${currentUser.alias}!</h3>
                            <p><strong>CS Balance:</strong> ${currentUser.cs_balance || 0}</p>
                            <p><strong>NFTs:</strong> ${currentUser.nfts || 0}</p>
                            <p><strong>Wallet:</strong> ${walletManager.wallet || 'Not connected'}</p>
                        </div>
                        
                        <div class="wallet-info">
                            <h3>🔗 Wallet Data</h3>
                            <button class="btn" onclick="showWalletData()">View Data</button>
                            <button class="btn" onclick="refreshBalance()">Refresh</button>
                            <div id="walletData" class="hidden" style="margin-top: 20px; padding: 20px; background: #0a0a0a; border-radius: 8px; font-family: monospace; font-size: 12px;"></div>
                        </div>
                        
                        <div class="wallet-info">
                            <button class="btn" onclick="exportData()">Export Data</button>
                            <button class="btn" onclick="clearData()" style="background: #ff4444;">Clear Data</button>
                        </div>
                    ` : `
                        <div class="form-group">
                            <label>Alias</label>
                            <input type="text" id="alias" placeholder="your.alias">
                        </div>
                        <div class="form-group">
                            <label>Interests</label>
                            <textarea id="interests" placeholder="What are you passionate about?"></textarea>
                        </div>
                        <button class="btn" onclick="signup()">Join DAO</button>
                    `}
                </div>
            `;
        }

        // Functions
        async function signup() {
            const alias = document.getElementById('alias').value;
            const interests = document.getElementById('interests').value;
            
            if (!alias || !interests) {
                alert('Please fill in all fields');
                return;
            }
            
            currentUser = {
                alias,
                interests,
                cs_balance: 100,
                nfts: 0,
                projects: 0,
                wallet_address: walletManager.wallet
            };
            
            localStorage.setItem('consilience_user', JSON.stringify(currentUser));
            alert(`Welcome ${alias}! You've joined the DAO with 100 CS tokens!`);
            showPage('dashboard');
        }

        async function mintNFT() {
            const description = prompt('Describe your NFT:') || 'Consilience NFT';
            
            try {
                const response = await fetch('/api/ai-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: `mint an NFT: ${description}`,
                        alias: currentUser?.alias || 'anonymous'
                    })
                });
                
                const data = await response.json();
                alert(data.response);
                
                if (currentUser && data.response.includes('✅')) {
                    currentUser.nfts = (currentUser.nfts || 0) + 1;
                    currentUser.cs_balance = (currentUser.cs_balance || 0) + 25;
                    localStorage.setItem('consilience_user', JSON.stringify(currentUser));
                }
            } catch (error) {
                alert('NFT creation failed');
            }
        }

        async function createToken() {
            const name = prompt('Token name:') || 'My Token';
            
            try {
                const response = await fetch('/api/ai-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: `create token: ${name}`,
                        alias: currentUser?.alias || 'anonymous'
                    })
                });
                
                const data = await response.json();
                alert(data.response);
                
                if (currentUser && data.response.includes('✅')) {
                    currentUser.cs_balance = (currentUser.cs_balance || 0) + 50;
                    localStorage.setItem('consilience_user', JSON.stringify(currentUser));
                }
            } catch (error) {
                alert('Token creation failed');
            }
        }

        function createProject() {
            const name = prompt('Project name:');
            if (name) {
                alert(`Project "${name}" created!`);
                if (currentUser) {
                    currentUser.projects = (currentUser.projects || 0) + 1;
                    localStorage.setItem('consilience_user', JSON.stringify(currentUser));
                }
            }
        }

        function findMatches() {
            alert('🎯 Perfect matches found:\\n\\n• alice.builder (95% match)\\n• bob.creator (87% match)\\n• charlie.dev (82% match)');
        }

        function joinProject(project) {
            alert(`Joined ${project} project! Welcome to the team!`);
        }

        function openChat(username) {
            currentChatUser = username;
            document.getElementById('chatHeader').textContent = `Chat with ${username}`;
            
            const messages = {
                'alice.builder': "Hey! I'm working on Mars Colony DAO. Want to collaborate on habitat governance?",
                'bob.creator': "Hi! Leading Ocean Cleanup Protocol. Need help with DeFi mechanisms. Interested?",
                'charlie.dev': "What's up! Rust developer here. Looking for cool DAO projects. What are you building?"
            };
            
            document.getElementById('chatMessages').innerHTML = `
                <div class="message">
                    <div class="message-author">${username}</div>
                    <div>${messages[username]}</div>
                </div>
            `;
            document.getElementById('chatInput').style.display = 'flex';
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message || !currentChatUser) return;
            
            const messagesDiv = document.getElementById('chatMessages');
            messagesDiv.innerHTML += `
                <div class="message">
                    <div class="message-author">You</div>
                    <div>${message}</div>
                </div>
            `;
            
            input.value = '';
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            
            // Smart responses
            const responses = {
                'hi': "Great to connect! I'm excited about collaboration opportunities.",
                'hello': "Hello! I think we could work well together.",
                'ok': "Perfect! What kind of project interests you most?",
                'yes': "Awesome! Let's dive into the details.",
                'project': "I'm working on exciting DAO initiatives. Interested in governance or DeFi?",
                'token': "Token economics is fascinating! I'm exploring sustainable funding models.",
                'nft': "NFTs are powerful for community building. Have you created collections?",
                'dao': "DAOs are the future! What aspects interest you most?",
                'solana': "Solana is amazing for fast, low-cost apps. Know Rust development?"
            };
            
            let response = responses[message.toLowerCase()] || "That's interesting! Tell me more about your thoughts.";
            
            setTimeout(() => {
                messagesDiv.innerHTML += `
                    <div class="message">
                        <div class="message-author">${currentChatUser}</div>
                        <div>${response}</div>
                    </div>
                `;
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }, 1000);
        }

        async function connectWallet() {
            const wallet = await walletManager.connectWallet();
            if (wallet) {
                document.getElementById('walletBtn').textContent = wallet.slice(0, 8) + '...';
                alert('Wallet connected: ' + wallet);
            }
        }

        function showWalletData() {
            const div = document.getElementById('walletData');
            if (!div) return;
            
            if (div.classList.contains('hidden')) {
                div.classList.remove('hidden');
                div.innerHTML = `<pre>${JSON.stringify({
                    user: currentUser,
                    wallet: walletManager.wallet,
                    timestamp: new Date().toISOString()
                }, null, 2)}</pre>`;
            } else {
                div.classList.add('hidden');
            }
        }

        function refreshBalance() {
            if (!currentUser) {
                alert('Please join DAO first');
                return;
            }
            
            currentUser.cs_balance = Math.floor(Math.random() * 500) + 100;
            currentUser.nfts = Math.floor(Math.random() * 10);
            localStorage.setItem('consilience_user', JSON.stringify(currentUser));
            
            showPage('profile');
            alert(`Balance updated! CS: ${currentUser.cs_balance}, NFTs: ${currentUser.nfts}`);
        }

        function exportData() {
            if (!currentUser) {
                alert('No data to export');
                return;
            }
            
            const data = {
                user: currentUser,
                wallet: walletManager.wallet,
                exported: new Date().toISOString()
            };
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `consilience-${currentUser.alias}.json`;
            a.click();
            URL.revokeObjectURL(url);
            alert('Data exported!');
        }

        function clearData() {
            if (confirm('Clear all data? This cannot be undone.')) {
                localStorage.clear();
                currentUser = null;
                walletManager.wallet = null;
                document.getElementById('walletBtn').textContent = 'Connect Wallet';
                showPage('profile');
                alert('All data cleared!');
            }
        }

        // Initialize
        showPage('dashboard');
        if (walletManager.wallet) {
            document.getElementById('walletBtn').textContent = walletManager.wallet.slice(0, 8) + '...';
        }
    </script>
</body>
</html>
