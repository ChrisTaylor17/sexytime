<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consilience DAO</title>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #fff;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #333;
            margin-bottom: 30px;
        }
        
        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #00ff88;
        }
        
        .nav {
            display: flex;
            gap: 20px;
        }
        
        .nav-item {
            padding: 10px 20px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .nav-item:hover, .nav-item.active {
            background: #00ff88;
            color: #000;
        }
        
        .btn {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .btn:hover {
            background: #00cc6a;
        }
        
        .btn-red {
            background: #ff4444;
            color: #fff;
        }
        
        .btn-purple {
            background: #8b5cf6;
            color: #fff;
        }
        
        .btn-green {
            background: #10b981;
            color: #fff;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        
        .card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 24px;
        }
        
        .card h3 {
            color: #00ff88;
            margin-bottom: 12px;
        }
        
        .card p {
            color: #888;
            margin-bottom: 16px;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        
        .stat {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            flex: 1;
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: #00ff88;
        }
        
        .stat-label {
            color: #888;
            font-size: 14px;
        }
        
        .form {
            max-width: 500px;
            margin: 0 auto;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 12px 16px;
            border-radius: 8px;
        }
        
        .match-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }
        
        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        
        .compatibility {
            color: #10b981;
            font-weight: 600;
        }
        
        .project-suggestion {
            background: #1e3a8a;
            padding: 12px;
            border-radius: 8px;
            margin-top: 12px;
            font-size: 14px;
        }
        
        .chat-container {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 20px;
            height: 400px;
            display: flex;
            flex-direction: column;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 16px;
            padding: 12px;
            background: #0a0a0a;
            border-radius: 8px;
        }
        
        .message {
            margin-bottom: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 80%;
        }
        
        .message.own {
            background: #1e40af;
            margin-left: auto;
            text-align: right;
        }
        
        .message.other {
            background: #374151;
        }
        
        .message-author {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .ai-message {
            background: #581c87;
            border: 1px solid #7c3aed;
            border-radius: 8px;
            max-width: 90%;
        }
        
        .ai-message .message-author {
            color: #a855f7;
            font-weight: 600;
        }
        
        .online-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            margin-right: 8px;
        }
        
        .hidden {
            display: none;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #888;
        }
        
        .loading::before {
            content: "🔄";
            display: block;
            font-size: 24px;
            margin-bottom: 8px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">CONSILIENCE DAO</div>
            <div class="nav">
                <div class="nav-item active" onclick="showPage('ai-chat')">🤖 AI Chat</div>
                <div class="nav-item" onclick="showPage('matching')">Find Partners</div>
                <div class="nav-item" onclick="showPage('dashboard')">Dashboard</div>
                <div class="nav-item" onclick="showPage('nfts')">🖼️ NFTs</div>
                <div class="nav-item" onclick="showPage('create')">Create</div>
                <div class="nav-item" onclick="showPage('profile')">Profile</div>
            </div>
            <button class="btn" id="walletBtn" onclick="connectWallet()">Connect Wallet</button>
        </div>
        
        <div id="content">
            <!-- Content loads here -->
        </div>
    </div>

    <script>
        // Initialize Socket.io for real-time matching
        let socket = null;
        let currentUser = JSON.parse(localStorage.getItem('consilience_user')) || null;
        let currentPage = 'dashboard';
        let activeMatches = [];
        let currentCollaboration = null;
        let isConnected = false;

        // AI chat mode
        let currentAIMode = 'direct';
        
        function setAIMode(mode) {
            currentAIMode = mode;
            showPage('ai-chat');
        }
        
        // Initialize socket connection
        function initSocket() {
            try {
                socket = io();
                
                socket.on('connect', () => {
                    console.log('Connected to server');
                    isConnected = true;
                });
                
                socket.on('disconnect', () => {
                    console.log('Disconnected from server');
                    isConnected = false;
                });
                
                socket.on('connect_error', (error) => {
                    console.log('Connection failed:', error);
                    isConnected = false;
                });
                
                return true;
            } catch (error) {
                console.log('Socket.io not available, using fallback');
                return false;
            }
        }
        
        // Initialize socket
        const socketAvailable = initSocket();

        // Socket event handlers (only if socket available)
        if (socket) {
            socket.on('potential-matches', (matches) => {
                activeMatches = matches;
                showMatches(matches);
            });

            socket.on('collaboration-started', (data) => {
                currentCollaboration = data;
                showCollaborationInterface(data);
            });

            socket.on('ai-guidance', (guidance) => {
                showAIGuidance(guidance);
            });

            socket.on('chat-message', (message) => {
                // Display in collaboration chat (visible to all participants)
                displayChatMessage(message, false);
            });

            socket.on('project-created', (project) => {
                alert(`🚀 Project "${project.name}" created successfully!`);
            });
        }

        // Wallet manager
        const walletManager = {
            wallet: localStorage.getItem('wallet_address'),
            async connectWallet() {
                if (window.solana && window.solana.isPhantom) {
                    try {
                        const response = await window.solana.connect();
                        this.wallet = response.publicKey.toString();
                        localStorage.setItem('wallet_address', this.wallet);
                        return this.wallet;
                    } catch (error) {
                        console.error('Wallet connection failed:', error);
                        return null;
                    }
                } else {
                    alert('Please install Phantom wallet');
                    return null;
                }
            }
        };

        function showPage(page) {
            currentPage = page;
            
            // Update nav
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            event.target.classList.add('active');
            
            const content = document.getElementById('content');
            
            switch(page) {
                case 'ai-chat':
                    content.innerHTML = renderAIChat();
                    break;
                case 'matching':
                    content.innerHTML = renderMatching();
                    break;
                case 'dashboard':
                    content.innerHTML = renderDashboard();
                    break;
                case 'create':
                    content.innerHTML = renderCreate();
                    break;
                case 'profile':
                    content.innerHTML = renderProfile();
                    break;
                case 'nfts':
                    content.innerHTML = renderNFTGallery();
                    loadNFTs();
                    break;
            }
        }

        function renderAIChat() {
            return `
                <div style="max-width: 800px; margin: 0 auto;">
                    <div style="display: flex; gap: 20px; margin-bottom: 20px;">
                        <button class="btn ${currentAIMode === 'direct' ? 'btn-purple' : ''}" onclick="setAIMode('direct')">🤖 Direct AI Chat</button>
                        <button class="btn ${currentAIMode === 'collab' ? 'btn-green' : ''}" onclick="setAIMode('collab')">🤝 AI-Guided Collaboration</button>
                    </div>
                    
                    ${currentAIMode === 'direct' ? `
                        <div class="card">
                            <h2>🤖 AI Assistant</h2>
                            <p>Chat directly with AI for help with blockchain development, project planning, and more!</p>
                            
                            <div class="chat-container" style="height: 600px; margin-top: 20px;">
                                <div class="chat-messages" id="aiChatMessages" style="height: 450px; background: #0a0a0a; border-radius: 8px; padding: 16px; overflow-y: auto;">
                                    <div class="message ai-message" style="background: #581c87; border: 1px solid #7c3aed; padding: 12px; border-radius: 8px; margin-bottom: 12px;">
                                        <div class="message-author" style="color: #a855f7; font-weight: 600; margin-bottom: 4px;">🤖 AI Assistant</div>
                                        <div>Hello! I'm your AI assistant for Consilience DAO. I can help you with:\n\n🪙 Creating tokens on Solana\n🎨 Minting NFTs\n🚀 Project planning\n🤝 Finding collaborators\n💡 Technical guidance\n\nWhat would you like to work on today?</div>
                                    </div>
                                </div>
                                
                                <div style="display: flex; gap: 12px; margin-top: 16px;">
                                    <input type="text" id="aiChatInput" placeholder="Ask me anything about blockchain, projects, or DAO collaboration..." style="flex: 1; padding: 12px; background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 8px;">
                                    <button class="btn btn-purple" onclick="sendAIMessage()">🚀 Send</button>
                                </div>
                                
                                <div style="display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap;">
                                    <button class="btn" style="font-size: 12px; padding: 6px 12px;" onclick="quickAIMessage('Create a token for my project')">Create Token</button>
                                    <button class="btn" style="font-size: 12px; padding: 6px 12px;" onclick="quickAIMessage('Mint an NFT')">Mint NFT</button>
                                    <button class="btn" style="font-size: 12px; padding: 6px 12px;" onclick="quickAIMessage('Help me plan a DAO project')">Plan Project</button>
                                    <button class="btn" style="font-size: 12px; padding: 6px 12px;" onclick="quickAIMessage('Find collaborators for my idea')">Find Partners</button>
                                </div>
                            </div>
                        </div>
                    ` : `
                        <h2>🤖 AI-Guided Collaboration</h2>
                        
                        ${!currentUser ? `
                            <div class="card">
                                <h3>Create Profile First</h3>
                                <p>Set up your profile to start AI-guided collaboration</p>
                                <button class="btn" onclick="showPage('profile')">Create Profile</button>
                            </div>
                        ` : `
                            <div class="card">
                                <h3>Welcome, ${currentUser.alias}!</h3>
                                <p>Find collaborators and let AI guide your project conversations</p>
                                <button class="btn btn-green" onclick="showPage('matching')">🎯 Find Partners</button>
                            </div>
                            
                            ${currentCollaboration ? `
                                <div class="card" style="background: #065f46; margin-top: 20px;">
                                    <h3>🤝 Active Collaboration with ${currentCollaboration.partner}</h3>
                                    <p><strong>AI Suggestion:</strong> ${currentCollaboration.suggestedProject}</p>
                                    
                                    <div style="margin: 20px 0; display: flex; gap: 12px;">
                                        <input type="text" id="projectName" placeholder="Project name..." style="flex: 1; padding: 8px; background: #0a0a0a; border: 1px solid #333; color: #fff; border-radius: 4px;">
                                        <button class="btn btn-purple" onclick="createCollabProject()">🚀 Create Project</button>
                                    </div>
                                    
                                    <div class="chat-container" style="height: 500px; margin-top: 20px;">
                                        <div class="chat-messages" id="chatMessages" style="height: 350px;"></div>

                                        <div style="display: flex; gap: 12px;">
                                            <input type="text" id="chatInput" placeholder="Type your message..." style="flex: 1; padding: 12px; background: #0a0a0a; border: 1px solid #333; color: #fff; border-radius: 8px;">
                                            <button class="btn" onclick="sendMessage()">Send</button>
                                        </div>
                                    </div>
                                </div>
                            ` : `
                                <div class="card">
                                    <h3>💬 No Active Collaboration</h3>
                                    <p>Find a partner to start AI-guided project building</p>
                                    <button class="btn" onclick="showPage('matching')">Find Collaborator</button>
                                </div>
                            `}
                        `}
                    `}
                </div>
            `;
        }
        
        function renderDashboard() {
            return `
                <div class="stats">
                    <div class="stat">
                        <div class="stat-number">${currentUser?.cs_balance || 0}</div>
                        <div class="stat-label">CS Tokens</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number">${currentUser?.nfts || 0}</div>
                        <div class="stat-label">NFTs</div>
                    </div>
                    <div class="stat">
                        <div class="stat-number">${currentUser?.projects || 0}</div>
                        <div class="stat-label">Projects</div>
                    </div>
                </div>
                
                <div class="grid">
                    <div class="card">
                        <h3>🎯 Find Real Collaborators</h3>
                        <p>Connect with live users who share your vision</p>
                        <button class="btn" onclick="showPage('matching')">Find Partners</button>
                    </div>
                    
                    <div class="card">
                        <h3>🤖 AI-Guided Projects</h3>
                        <p>Get AI suggestions for building together</p>
                        <button class="btn" onclick="showPage('matching')">Start Collaborating</button>
                    </div>
                    
                    <div class="card">
                        <h3>🎨 Create NFT</h3>
                        <p>Mint on Solana blockchain</p>
                        <button class="btn" onclick="mintNFT()">Mint NFT</button>
                    </div>
                    
                    <div class="card">
                        <h3>🪙 Create Token</h3>
                        <p>Launch your own token</p>
                        <button class="btn" onclick="createToken()">Create Token</button>
                    </div>
                </div>
            `;
        }

        function renderMatching() {
            return `
                <h2>🎯 Find Real Collaborators</h2>
                
                ${!currentUser ? `
                    <div class="card">
                        <h3>Join DAO First</h3>
                        <p>Create your profile to find matches</p>
                        <button class="btn" onclick="showPage('profile')">Create Profile</button>
                    </div>
                ` : `
                    <div class="card">
                        <h3>Your Profile</h3>
                        <p><strong>Alias:</strong> ${currentUser.alias}</p>
                        <p><strong>Skills:</strong> ${currentUser.skills || 'Not set'}</p>
                        <p><strong>Interests:</strong> ${currentUser.interests}</p>
                        <p><strong>Looking for:</strong> ${currentUser.lookingFor || 'Collaborator'}</p>
                        <button class="btn btn-green" onclick="goOnline()">🟢 Go Online & Find Matches</button>
                        <div id="onlineStatus" class="loading hidden">Finding compatible collaborators...</div>
                    </div>
                    
                    <div id="matchesSection" class="hidden">
                        <h3>🎯 Live Matches</h3>
                        <div id="matchesList"></div>
                    </div>
                    
                    <div id="collaborationSection" class="hidden">
                        <h3>🤝 Active Collaboration</h3>
                        <div id="collaborationContent"></div>
                        <div class="chat-container">
                            <div class="chat-messages" id="chatMessages"></div>
                            <div style="display: flex; gap: 12px;">
                                <input type="text" id="chatInput" placeholder="Type your message..." style="flex: 1; padding: 12px; background: #0a0a0a; border: 1px solid #333; color: #fff; border-radius: 8px;">
                                <button class="btn" onclick="sendMessage()">Send</button>
                            </div>
                            <div id="aiGuidance" class="ai-guidance hidden"></div>
                        </div>
                    </div>
                `}
            `;
        }

        function renderProjects() {
            return `
                <h2>DAO Projects</h2>
                <div class="grid">
                    <div class="card">
                        <h3>Mars Colony DAO</h3>
                        <p>Building sustainable habitats on Mars</p>
                        <button class="btn" onclick="joinProject('mars')">Join Project</button>
                    </div>
                    <div class="card">
                        <h3>Ocean Cleanup Protocol</h3>
                        <p>DeFi-powered ocean cleanup</p>
                        <button class="btn" onclick="joinProject('ocean')">Join Project</button>
                    </div>
                    <div class="card">
                        <h3>Neural Network DAO</h3>
                        <p>Decentralized AI research</p>
                        <button class="btn" onclick="joinProject('ai')">Join Project</button>
                    </div>
                </div>
            `;
        }

        function renderCreate() {
            return `
                <div class="form">
                    <h2>Create Something Amazing</h2>
                    <div class="grid">
                        <div class="card">
                            <h3>🎨 Mint NFT</h3>
                            <p>Create unique digital asset</p>
                            <button class="btn" onclick="mintNFT()">Create NFT</button>
                        </div>
                        <div class="card">
                            <h3>🪙 Launch Token</h3>
                            <p>Create cryptocurrency token</p>
                            <button class="btn" onclick="createToken()">Create Token</button>
                        </div>
                        <div class="card">
                            <h3>🚀 Start Project</h3>
                            <p>Launch new DAO project</p>
                            <button class="btn" onclick="createProject()">New Project</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderProfile() {
            return `
                <div class="form">
                    <h2>Your Profile</h2>
                    
                    ${currentUser ? `
                        <div class="card">
                            <h3>Welcome, ${currentUser.alias}!</h3>
                            <p><strong>CS Balance:</strong> ${currentUser.cs_balance || 0}</p>
                            <p><strong>NFTs:</strong> ${currentUser.nfts || 0}</p>
                            <p><strong>Wallet:</strong> ${walletManager.wallet || 'Not connected'}</p>
                            <button class="btn btn-red" onclick="clearData()">Clear Data</button>
                        </div>
                    ` : `
                        <div class="form-group">
                            <label>Alias</label>
                            <input type="text" id="alias" placeholder="your.alias">
                        </div>
                        <div class="form-group">
                            <label>Skills</label>
                            <input type="text" id="skills" placeholder="JavaScript, Design, Marketing...">
                        </div>
                        <div class="form-group">
                            <label>Interests</label>
                            <textarea id="interests" placeholder="DeFi, NFTs, Gaming, Social Impact..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>Looking For</label>
                            <select id="lookingFor">
                                <option value="collaborator">Project Collaborator</option>
                                <option value="mentor">Mentor</option>
                                <option value="team">Join a Team</option>
                                <option value="founder">Co-founder</option>
                                <option value="developer">Developer Partner</option>
                                <option value="designer">Design Partner</option>
                            </select>
                        </div>
                        <button class="btn" onclick="signup()">Join DAO</button>
                    `}
                </div>
            `;
        }

        // Core functions
        async function signup() {
            const alias = document.getElementById('alias').value;
            const skills = document.getElementById('skills').value;
            const interests = document.getElementById('interests').value;
            const lookingFor = document.getElementById('lookingFor').value;
            
            if (!alias || !skills || !interests) {
                alert('Please fill in all fields');
                return;
            }
            
            currentUser = {
                alias,
                skills,
                interests,
                lookingFor,
                cs_balance: 100,
                nfts: 0,
                projects: 0,
                wallet_address: walletManager.wallet
            };
            
            localStorage.setItem('consilience_user', JSON.stringify(currentUser));
            alert(`Welcome ${alias}! You've joined the DAO with 100 CS tokens!`);
            showPage('dashboard');
        }

        function goOnline() {
            if (!currentUser) {
                alert('Please create profile first');
                return;
            }

            // Show loading
            document.getElementById('onlineStatus').classList.remove('hidden');
            
            if (socket && isConnected) {
                // Announce user is online
                socket.emit('user-online', currentUser);
            } else {
                // No connection - show error
                setTimeout(() => {
                    document.getElementById('onlineStatus').innerHTML = `
                        <div style="color: #ff4444; text-align: center;">
                            ❌ Connection failed - Cannot find real users
                            <br><span style="font-size: 12px;">Check server connection</span>
                        </div>
                    `;
                }, 1000);
                return;
            }
            
            // Show matches section
            setTimeout(() => {
                document.getElementById('matchesSection').classList.remove('hidden');
            }, 1000);
        }

        function showMatches(matches) {
            const section = document.getElementById('matchesSection');
            const list = document.getElementById('matchesList');
            
            if (!section || !list) return;
            
            document.getElementById('onlineStatus').classList.add('hidden');
            section.classList.remove('hidden');
            
            if (matches.length === 0) {
                list.innerHTML = `
                    <div class="card">
                        <p>No matches found yet. More users coming online...</p>
                        <p style="font-size: 14px; color: #888;">Try updating your skills or interests!</p>
                    </div>
                `;
                return;
            }
            
            list.innerHTML = matches.map(match => `
                <div class="match-card">
                    <div class="match-header">
                        <div>
                            <h4>${match.alias}</h4>
                            <div class="compatibility">${match.compatibility}% compatibility</div>
                        </div>
                        <button class="btn btn-green" onclick="acceptMatch('${match.alias}')">
                            🤝 Collaborate
                        </button>
                    </div>
                    <p><strong>Skills:</strong> ${match.skills}</p>
                    <p><strong>Interests:</strong> ${match.interests}</p>
                    <div class="project-suggestion">
                        <strong>💡 AI Suggestion:</strong> ${match.suggestedProject}
                    </div>
                </div>
            `).join('');
        }

        function acceptMatch(matchedUser) {
            if (socket && isConnected) {
                socket.emit('accept-match', { matchedUser });
            } else {
                alert('❌ Connection required for real collaboration');
            }
        }

        function showCollaborationInterface(data) {
            const section = document.getElementById('collaborationSection');
            const content = document.getElementById('collaborationContent');
            
            if (!section || !content) return;
            
            section.classList.remove('hidden');
            
            content.innerHTML = `
                <div class="card" style="background: #065f46;">
                    <h4>🎉 Collaboration Started!</h4>
                    <p><strong>Partner:</strong> ${data.partner}</p>
                    <p><strong>AI Suggestion:</strong> ${data.suggestedProject}</p>
                    <div style="margin-top: 16px; display: flex; gap: 12px;">
                        <input type="text" id="projectName" placeholder="Project name..." style="flex: 1; padding: 8px; background: #0a0a0a; border: 1px solid #333; color: #fff; border-radius: 4px;">
                        <button class="btn btn-purple" onclick="createCollabProject()">🚀 Create Project</button>
                    </div>
                </div>
            `;
            
            // Initialize chat with AI welcome
            const chatMessages = document.getElementById('chatMessages');
            if (chatMessages) {
                chatMessages.innerHTML = `
                    <div style="text-align: center; color: #888; font-size: 14px; margin-bottom: 16px;">
                        💬 Collaboration chat started with ${data.partner}
                    </div>
                `;
                
                // AI joins the conversation
                setTimeout(() => {
                    displayChatMessage({
                        from: '🤖 AI Assistant',
                        message: `Hi ${currentUser.alias} and ${data.partner}! I'm your AI collaborator. I can help guide your project, create tokens, mint NFTs, and suggest next steps. Let's build something amazing together! 🚀`,
                        timestamp: Date.now()
                    }, false);
                }, 1000);
            }
        }

        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message || !currentCollaboration) return;
            
            if (socket && isConnected) {
                // Send message via socket
                socket.emit('chat-message', {
                    to: currentCollaboration.partner,
                    message,
                    roomId: currentCollaboration.roomId
                });
            } else {
                alert('❌ Connection required for real chat');
                return;
            }
            
            // Display locally
            displayChatMessage({
                from: currentUser.alias,
                message,
                timestamp: Date.now()
            }, true);
            
            // AI responses are now handled by the server and broadcast to all participants
            
            input.value = '';
        }

        function displayChatMessage(messageData, isOwn) {
            const chatMessages = document.getElementById('chatMessages');
            if (!chatMessages) return;
            
            const isAI = messageData.from.includes('AI Assistant');
            const messageDiv = document.createElement('div');
            
            if (isAI) {
                messageDiv.className = 'message ai-message';
                messageDiv.style.background = '#581c87';
                messageDiv.style.border = '1px solid #7c3aed';
                messageDiv.style.maxWidth = '90%';
                messageDiv.style.padding = '12px';
                messageDiv.style.borderRadius = '8px';
                messageDiv.style.marginBottom = '12px';
            } else {
                messageDiv.className = `message ${isOwn ? 'own' : 'other'}`;
            }
            
            messageDiv.innerHTML = `
                <div class="message-author" style="${isAI ? 'color: #a855f7; font-weight: 600; margin-bottom: 4px;' : ''}">${messageData.from}</div>
                <div style="white-space: pre-line;">${messageData.message}</div>
            `;
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        // Direct AI chat functions
        async function sendAIMessage() {
            const input = document.getElementById('aiChatInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Display user message
            displayAIMessage({
                from: currentUser?.alias || 'You',
                message: message,
                timestamp: Date.now()
            }, true);
            
            input.value = '';
            
            // Show AI thinking
            displayAIMessage({
                from: '🤖 AI Assistant',
                message: '💭 Thinking...',
                timestamp: Date.now()
            }, false);
            
            try {
                const response = await fetch('/api/ai-chat-direct', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: message,
                        alias: currentUser?.alias || 'anonymous'
                    })
                });
                
                const data = await response.json();
                
                // Remove thinking message
                const aiChatMessages = document.getElementById('aiChatMessages');
                if (aiChatMessages && aiChatMessages.lastChild) {
                    aiChatMessages.removeChild(aiChatMessages.lastChild);
                }
                
                // Display AI response
                displayAIMessage({
                    from: '🤖 AI Assistant',
                    message: data.response,
                    timestamp: Date.now()
                }, false);
                
            } catch (error) {
                // Remove thinking message
                const aiChatMessages = document.getElementById('aiChatMessages');
                if (aiChatMessages && aiChatMessages.lastChild) {
                    aiChatMessages.removeChild(aiChatMessages.lastChild);
                }
                
                displayAIMessage({
                    from: '🤖 AI Assistant',
                    message: '⚠️ Sorry, I\'m having trouble connecting. I can still help with basic guidance though! What would you like to work on?',
                    timestamp: Date.now()
                }, false);
            }
        }
        
        function displayAIMessage(messageData, isOwn) {
            const aiChatMessages = document.getElementById('aiChatMessages');
            if (!aiChatMessages) return;
            
            const isAI = messageData.from.includes('AI Assistant');
            const messageDiv = document.createElement('div');
            
            if (isAI) {
                messageDiv.className = 'message ai-message';
                messageDiv.style.background = '#581c87';
                messageDiv.style.border = '1px solid #7c3aed';
                messageDiv.style.padding = '12px';
                messageDiv.style.borderRadius = '8px';
                messageDiv.style.marginBottom = '12px';
                messageDiv.style.maxWidth = '90%';
            } else {
                messageDiv.className = `message ${isOwn ? 'own' : 'other'}`;
                messageDiv.style.background = isOwn ? '#1e40af' : '#374151';
                messageDiv.style.padding = '8px 12px';
                messageDiv.style.borderRadius = '8px';
                messageDiv.style.marginBottom = '12px';
                messageDiv.style.maxWidth = '80%';
                if (isOwn) {
                    messageDiv.style.marginLeft = 'auto';
                    messageDiv.style.textAlign = 'right';
                }
            }
            
            messageDiv.innerHTML = `
                <div class="message-author" style="${isAI ? 'color: #a855f7; font-weight: 600; margin-bottom: 4px;' : 'font-size: 12px; font-weight: 600; margin-bottom: 4px;'}">${messageData.from}</div>
                <div style="white-space: pre-line;">${messageData.message}</div>
            `;
            
            aiChatMessages.appendChild(messageDiv);
            aiChatMessages.scrollTop = aiChatMessages.scrollHeight;
        }
        
        function quickAIMessage(message) {
            document.getElementById('aiChatInput').value = message;
            sendAIMessage();
        }

        function showAIGuidance(guidance) {
            const guidanceDiv = document.getElementById('aiGuidance');
            if (!guidanceDiv) return;
            
            guidanceDiv.style.display = 'block';
            guidanceDiv.innerHTML = `🤖 AI Guide: ${guidance.message}`;
            guidanceDiv.style.background = '#7c3aed';
            guidanceDiv.style.border = '2px solid #a855f7';
            
            // Fade back to default after 10 seconds
            setTimeout(() => {
                guidanceDiv.style.background = '#581c87';
                guidanceDiv.style.border = '1px solid #7c3aed';
            }, 10000);
        }
        
        // Note: AI responses in collaboration chat are now handled by the server
        // and broadcast to all participants via socket events

        function createCollabProject() {
            const projectName = document.getElementById('projectName').value.trim();
            
            if (!projectName || !currentCollaboration) {
                alert('Please enter a project name');
                return;
            }
            
            if (socket && isConnected) {
                socket.emit('create-project', {
                    name: projectName,
                    description: `Collaborative project between ${currentUser.alias} and ${currentCollaboration.partner}`,
                    roomId: currentCollaboration.roomId,
                    partner: currentCollaboration.partner
                });
            } else {
                alert('❌ Connection required for real project creation');
            }
        }

        // Existing functions
        async function mintNFT() {
            const description = prompt('Describe your NFT:') || 'Consilience NFT';
            
            try {
                const response = await fetch('/api/ai-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: `mint an NFT: ${description}`,
                        alias: currentUser?.alias || 'anonymous'
                    })
                });
                
                const data = await response.json();
                alert(data.response);
                
                if (currentUser && data.response.includes('✅')) {
                    currentUser.nfts = (currentUser.nfts || 0) + 1;
                    currentUser.cs_balance = (currentUser.cs_balance || 0) + 25;
                    localStorage.setItem('consilience_user', JSON.stringify(currentUser));
                }
            } catch (error) {
                alert('NFT creation failed');
            }
        }

        async function createToken() {
            const name = prompt('Token name:') || 'My Token';
            
            try {
                const response = await fetch('/api/ai-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        message: `create token: ${name}`,
                        alias: currentUser?.alias || 'anonymous'
                    })
                });
                
                const data = await response.json();
                alert(data.response);
                
                if (currentUser && data.response.includes('✅')) {
                    currentUser.cs_balance = (currentUser.cs_balance || 0) + 50;
                    localStorage.setItem('consilience_user', JSON.stringify(currentUser));
                }
            } catch (error) {
                alert('Token creation failed');
            }
        }

        function createProject() {
            const name = prompt('Project name:');
            if (name) {
                alert(`Project "${name}" created!`);
                if (currentUser) {
                    currentUser.projects = (currentUser.projects || 0) + 1;
                    localStorage.setItem('consilience_user', JSON.stringify(currentUser));
                }
            }
        }

        function joinProject(project) {
            alert(`Joined ${project} project! Welcome to the team!`);
        }

        async function connectWallet() {
            const wallet = await walletManager.connectWallet();
            if (wallet) {
                document.getElementById('walletBtn').textContent = wallet.slice(0, 8) + '...';
                alert('Wallet connected: ' + wallet);
            }
        }

        function clearData() {
            if (confirm('Clear all data? This cannot be undone.')) {
                localStorage.clear();
                currentUser = null;
                walletManager.wallet = null;
                document.getElementById('walletBtn').textContent = 'Connect Wallet';
                showPage('profile');
                alert('All data cleared!');
            }
        }

        // Handle Enter key in chat
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.target.id === 'chatInput') {
                sendMessage();
            }
            if (e.key === 'Enter' && e.target.id === 'aiChatInput') {
                sendAIMessage();
            }
        });

        function renderNFTGallery() {
            return `
                <h2>🖼️ NFT Gallery</h2>
                <p>AI-generated NFTs created on Consilience DAO</p>
                
                <div id="nftGrid" class="grid" style="grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));">
                    <div class="loading">Loading NFTs...</div>
                </div>
            `;
        }
        
        async function loadNFTs() {
            try {
                const response = await fetch('/api/nfts');
                const nfts = await response.json();
                
                const grid = document.getElementById('nftGrid');
                if (!grid) return;
                
                if (nfts.length === 0) {
                    grid.innerHTML = `
                        <div class="card">
                            <h3>No NFTs Yet</h3>
                            <p>Create your first NFT using the AI chat!</p>
                            <button class="btn" onclick="showPage('ai-chat')">Create NFT</button>
                        </div>
                    `;
                    return;
                }
                
                grid.innerHTML = nfts.map(nft => `
                    <div class="card" style="text-align: center;">
                        <img src="${nft.image}" alt="${nft.name}" style="width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 12px;">
                        <h4>${nft.name}</h4>
                        <p style="font-size: 14px; color: #888;">${nft.description}</p>
                        <div style="margin: 12px 0;">
                            <span style="background: ${nft.isReal ? '#10b981' : '#f59e0b'}; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px;">
                                ${nft.isReal ? '✅ Real' : '⚠️ Simulated'}
                            </span>
                        </div>
                        <div style="font-size: 12px; color: #666;">
                            <div>Mint: ${nft.mintAddress.slice(0, 8)}...</div>
                            <div>Created: ${new Date(nft.createdAt).toLocaleDateString()}</div>
                        </div>
                        <button class="btn" style="margin-top: 8px; font-size: 12px; padding: 6px 12px;" onclick="window.open('${nft.explorerUrl}', '_blank')">View on Explorer</button>
                    </div>
                `).join('');
                
            } catch (error) {
                const grid = document.getElementById('nftGrid');
                if (grid) {
                    grid.innerHTML = `
                        <div class="card">
                            <h3>Error Loading NFTs</h3>
                            <p>Could not load NFT gallery</p>
                        </div>
                    `;
                }
            }
        }
        
        // Initialize
        showPage('ai-chat');
        if (walletManager.wallet) {
            document.getElementById('walletBtn').textContent = walletManager.wallet.slice(0, 8) + '...';
        }
    </script>
</body>
</html>
